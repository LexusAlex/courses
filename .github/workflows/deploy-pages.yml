name: Publish courses to GitHub Pages

# Publication is deliberately manual. No push trigger and no remote deployment
# are performed while this scaffold is being prepared.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      # Public project site, inheriting the domain of the account's Pages site.
      SITE_URL: https://lexusalex.ru
      SITE_BASE: /courses/
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build and validate https://lexusalex.ru/courses/
        run: |
          pnpm build
          pnpm verify
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify published pages and assets
        timeout-minutes: 6
        run: node scripts/check-deployment.mjs --url https://lexusalex.ru/courses/ --attempts 12 --delay 5000
